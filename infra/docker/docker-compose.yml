services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=credkit
      - POSTGRES_PASSWORD=credkit
      - POSTGRES_DB=credkit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credkit -d credkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app
      - ../../ops:/ops
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://credkit:credkit@postgres/credkit
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-super-secret-key
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    command: sleep 3600

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
